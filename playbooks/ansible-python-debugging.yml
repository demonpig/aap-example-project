---
# RHEL 9 / RHEL 10 (Red Hat Enterprise Linux only for CRB + doc-aligned flow):
# (1) Enable CRB (CodeReady Builder), then install Python 3 debug symbols.
# (2) Sleep infinity (async so the play returns).
#
# Standard path (default): dnf debuginfo-install python3
# Alternative: set python_debug_use_interpreter_debug_rpm: true to install
#   python3.Y-debug (e.g. python3.9-debug on RHEL 9, python3.12-debug on RHEL 10)
#   matching the detected interpreter version.
#
# Non-RHEL hosts: tasks in the block are skipped (gather_facts still runs on all).
# CRB enable uses subscription-manager and runs only on ansible_distribution == RedHat.

- name: Detect Python version and install Python 3 debug symbols (RHEL 9+ flow)
  hosts: all
  gather_facts: true
  become: true
  vars:
    py_cmd: "{{ ansible_python_interpreter | default(ansible_facts['python']['executable'] | default('/usr/bin/python3')) }}"
    # false: dnf debuginfo-install python3 (recommended). true: dnf install python3.Y-debug
    python_debug_use_interpreter_debug_rpm: false
  tasks:
    - name: RHEL family — CRB, version report, and debug install
      when: ansible_os_family == 'RedHat'
      block:
        - name: Enable CRB repository (subscription-manager, RHEL 9+)
          ansible.builtin.command:
            argv:
              - subscription-manager
              - repos
              - --enable
              - "codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-rpms"
          register: crb_enable
          when:
            - ansible_distribution == 'RedHat'
            - ansible_distribution_major_version | int >= 9
          changed_when: >-
            crb_enable.rc == 0
            and ('already enabled' not in crb_enable.stdout | default('') | lower)
            and ('already enabled' not in crb_enable.stderr | default('') | lower)
          failed_when: >-
            crb_enable.rc != 0
            and ('already enabled' not in crb_enable.stdout | default('') | lower)
            and ('already enabled' not in crb_enable.stderr | default('') | lower)

        - name: Resolve Python major.minor (e.g. 3.12 on RHEL 10)
          ansible.builtin.command:
            argv:
              - "{{ py_cmd }}"
              - "-c"
              - "import sys; print('{}.{}'.format(sys.version_info.major, sys.version_info.minor))"
          register: python_mm
          changed_when: false

        - name: Show Python version in use on managed host
          ansible.builtin.debug:
            msg: >-
              Managed host: {{ ansible_distribution }} {{ ansible_distribution_version }}
              — Python {{ python_mm.stdout }} (default / platform convention follows RHEL 9/10 docs).

        - name: Install Python 3 debuginfo symbols (dnf debuginfo-install python3)
          ansible.builtin.command:
            argv:
              - dnf
              - debuginfo-install
              - "-y"
              - python3
          register: dnf_debuginfo
          when: not (python_debug_use_interpreter_debug_rpm | bool)
          changed_when: >-
            dnf_debuginfo.rc == 0 and
            ('Nothing to do' not in dnf_debuginfo.stdout | default(''))

        - name: Install version-specific Python debug interpreter package (python3.Y-debug)
          ansible.builtin.dnf:
            name: "python{{ python_mm.stdout }}-debug"
            state: present
          when: python_debug_use_interpreter_debug_rpm | bool

- name: Run sleep infinity on managed hosts
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: RHEL-only — sleep infinity
      when: ansible_os_family == 'RedHat'
      block:
        - name: Sleep forever (async so Ansible does not wait forever)
          ansible.builtin.command: sleep infinity
          async: 31536000
          poll: 0
